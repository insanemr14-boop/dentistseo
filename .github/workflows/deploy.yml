# Deploy to Cloudflare Pages on every push to main.
#
# Why a workflow instead of Cloudflare's own Git integration:
# this Pages project was created as a Direct Upload project, and Cloudflare
# refuses to convert one ("You cannot update the `source` object in a Direct
# Uploads project"). Converting would mean deleting and recreating it — which
# would destroy GMAIL_USER / GMAIL_PASS / LEAD_TO, since Pages secrets are
# write-only and cannot be read back through the API.
#
# Those secrets power the /api/lead worker that EVERY site in the network posts
# to, so losing them would take down lead capture everywhere. Pushing the built
# output from CI gets the same push-to-deploy behaviour and leaves them intact.
#
# Requires one repository secret: CLOUDFLARE_API_TOKEN
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Scope needed: Account -> Cloudflare Pages -> Edit
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The site is a static WordPress export — public/ is already the finished
      # artifact, so there is nothing to build. public/_worker.js is picked up
      # automatically as the Pages advanced-mode worker.
      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 41e4c861c3b246bbdb79f549272baaf8
          command: pages deploy public --project-name=dentistseo --branch=main
